id: px03-csp-ausente-prod
info:
  name: "Content-Security-Policy ausente na resposta HTTPS de produção"
  author: redteam-sisdef
  severity: info
  description: "Validação de headers (só em PROD): sem CSP na resposta do nginx/dokku."
  tags: prod-exclusive,headers
http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "Content-Security-Policy"
        negative: true
