id: px08-usuario-por-id-anon-200-prod
info:
  name: "Leitura anônima de perfil de usuário em produção (/usuario/:id sem requireAuth aplicado)"
  author: redteam-sisdef
  severity: medium
  description: "Sonda read-only: /usuario/:id anonimo deve ser 401 (requireAuth). Qualquer 200 = leak de perfil REAL (dados de usuário da UFBA)."
  tags: prod-exclusive,idor,read-only
http:
  - method: GET
    path:
      - "{{BaseURL}}/usuario/1"
      - "{{BaseURL}}/usuario/2"
